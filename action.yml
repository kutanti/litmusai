name: 'LitmusAI Agent Evaluation'
description: 'Run AI agent evaluations in CI/CD. Compare against baselines, detect regressions, post PR comments.'
author: 'kutanti'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  suite:
    description: 'Test suite name or path to YAML file'
    required: true
  agent:
    description: 'Agent module path (e.g. my_agent:agent)'
    required: true
  baseline:
    description: 'Path to baseline results JSON'
    required: false
    default: '.litmus/baseline.json'
  threshold:
    description: 'Minimum pass rate to succeed (0.0-1.0)'
    required: false
    default: '0.7'
  budget:
    description: 'Maximum total cost budget ($)'
    required: false
    default: ''
  concurrency:
    description: 'Max parallel evaluations'
    required: false
    default: '5'
  save-baseline:
    description: 'Save results as new baseline'
    required: false
    default: 'false'
  runs:
    description: 'Number of evaluation runs for statistical analysis'
    required: false
    default: '1'
  log-dir:
    description: 'Directory to save result logs'
    required: false
    default: ''
  post-comment:
    description: 'Post results as PR comment'
    required: false
    default: 'true'
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'

outputs:
  pass-rate:
    description: 'Evaluation pass rate (0.0-1.0)'
    value: ${{ steps.eval.outputs.pass-rate }}
  total-cost:
    description: 'Total estimated evaluation cost in USD, or unknown'
    value: ${{ steps.eval.outputs.total-cost }}
  passed:
    description: 'Number of passed tests'
    value: ${{ steps.eval.outputs.passed }}
  failed:
    description: 'Number of failed tests'
    value: ${{ steps.eval.outputs.failed }}
  has-regression:
    description: 'Whether regressions were detected'
    value: ${{ steps.eval.outputs.has-regression }}
  results-path:
    description: 'Path to results JSON file'
    value: ${{ steps.eval.outputs.results-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install LitmusAI
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run evaluation
      shell: bash
      id: eval
      env:
        INPUT_SUITE: ${{ inputs.suite }}
        INPUT_AGENT: ${{ inputs.agent }}
        INPUT_CONCURRENCY: ${{ inputs.concurrency }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_BUDGET: ${{ inputs.budget }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_SAVE_BASELINE: ${{ inputs.save-baseline }}
        INPUT_RUNS: ${{ inputs.runs }}
        INPUT_LOG_DIR: ${{ inputs.log-dir }}
        INPUT_POST_COMMENT: ${{ inputs.post-comment }}
      run: python "$GITHUB_ACTION_PATH/scripts/run_action.py"

    - name: Post PR comment
      if: always() && steps.eval.outputs.comment-path != ''
      uses: thollander/actions-comment-pull-request@v3
      with:
        file-path: ${{ steps.eval.outputs.comment-path }}
        comment-tag: litmusai-results
